.brandwrap{display:flex;align-items:center;gap:15px}
.mark{width:56px;height:56px;flex:0 0 auto}
.title h1{font-family:'Poppins';font-weight:800;font-size:30px;margin:0;letter-spacing:-.5px;line-height:1;color:#f7f3ea}
.title .sub{font-family:'Poppins';font-weight:600;font-size:13px;color:#bfe6de;
  letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}
.meta-tag{font-family:'Poppins';font-weight:700;font-size:14px;color:#00382f;background:#f7f3ea;
  padding:8px 17px;border-radius:999px;letter-spacing:.2px}
.meta-line{font-size:13px;color:#f7f3ea;font-weight:500}
.meta-line span{color:#bfe6de;font-weight:600;text-transform:uppercase;font-size:10px;
  letter-spacing:.6px;margin-right:7px}
/* tags inline */
.otag{display:inline-block;background:var(--amber-soft);color:#a45e0a;border:1px solid var(--amber-line);
  font-family:'Poppins';font-weight:600;font-size:11px;padding:1px 10px;border-radius:999px;vertical-align:middle}
.flag-warn{margin-top:12px;background:var(--amber-soft);border:1px solid var(--amber-line);color:#a45e0a;
  border-radius:10px;padding:11px 15px;font-size:13px;font-weight:600;font-family:'Poppins';
  display:flex;gap:9px;align-items:center;line-height:1.35}

/* TABS */
.tabs{display:flex;gap:6px;margin:22px 0 20px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:6px;box-shadow:var(--shadow);width:max-content;max-width:100%}
.tab{font-family:'Poppins';font-weight:600;font-size:14px;color:var(--muted);padding:10px 22px;
  border-radius:8px;cursor:pointer;border:none;background:none;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--green-deep)}
.tab.active{background:var(--green);color:#fff}

.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden}
.day-head{padding:15px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;
  gap:12px;flex-wrap:wrap}
.day-head .d{font-family:'Poppins';font-weight:800;font-size:18px}
.day-head .dd{color:var(--muted);font-size:13px;font-weight:500}
.day-head .loc{margin-left:auto;font-size:12px;color:var(--green-deep);background:var(--green-soft);
  border:1px solid var(--green-line);padding:4px 12px;border-radius:999px;font-weight:600}

/* PROGRAMAÇÃO rows */
.prow{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;
  padding:15px 24px;border-bottom:1px solid #f0f4f3}
.prow:last-child{border-bottom:none}
.ptime{font-family:'Poppins';font-weight:700;font-size:18px;color:var(--ink);
  border:2px solid var(--green-line);border-radius:12px;padding:10px 0;text-align:center;letter-spacing:.3px}
.ptime.small{font-size:14px}
.pact .a{font-family:'Poppins';font-weight:700;font-size:16px}
.pact .s{color:var(--muted);font-size:13.5px;margin-top:1px}

/* ROTINA rows */
.row{display:grid;grid-template-columns:96px 130px 1fr;gap:16px;align-items:center;
  padding:14px 24px;border-bottom:1px solid #f0f4f3}
.row:last-child{border-bottom:none}
.time{font-family:'Poppins';font-weight:800;font-size:19px;color:var(--ink);border:2px solid var(--green-line);
  border-radius:12px;padding:8px 0;text-align:center;letter-spacing:.5px}
.who-chip{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins';font-weight:600;font-size:13px;
  padding:7px 13px;border-radius:999px;justify-self:start;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%}
.act .a{font-family:'Poppins';font-weight:700;font-size:15px}
.act .path{color:var(--muted);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arrow{color:var(--green);font-weight:700}
.pax{background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green-line);
  font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.pax.both{background:#eef1f0;color:var(--muted);border-color:var(--line)}
.note{font-size:12.5px;color:var(--muted2);margin-top:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:14px 20px;box-shadow:var(--shadow)}
.legend .item{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500}
.legend .sw{width:14px;height:14px;border-radius:5px}
.legend .who{font-family:'Poppins';font-weight:700}

/* CONVIDADOS - lista */

  h+='</div><div class="sec-t">Chegadas e retornos</div><div class="mv">';
  for(const m of M) h+=`<div class="prow"><div class="ptime${m.tipo==='Retorno'?' out':''}">${e(m.quando)}</div>
    <div class="pact"><div class="a">${e(m.tipo)} · ${e(m.quem)}</div><div class="s">${e(m.voo)}${m.nota?' · '+e(m.nota):''}</div></div></div>`;
  $('lista').innerHTML=h+'</div>';
}
function detalhe(c){
  let h=`<div class="detail-head"><button class="back" data-back>‹ Convidados</button></div>
  <div class="card"><div class="card-head"><div class="avatar" style="background:${c.cor}">${c.ini}</div>
  <div><div class="role">${e(c.papel)}</div><div class="name">${e(c.nome)}<small>${e(c.completo)}</small></div></div></div><div class="card-body">`;
  for(const a of c.avisos) h+=`<div class="flag-warn">⚠ ${e(a)}</div>`;
  for(const v of c.voos) h+=`<div class="leg-label"><svg class="ico" viewBox="0 0 24 24" fill="none"><path d="${PLANE[v.tipo]}" stroke="#0a6e63" stroke-width="1.6" stroke-linejoin="round"/></svg>
    ${v.tipo}<span class="airline">${e(v.cia)} · Loc. ${e(v.loc)}</span></div>
    <div class="route"><div class="port l"><div class="code">${v.de}</div><div class="airport">${NOME[v.de]}</div><div class="when">${v.sai}</div></div>
    <div class="mid"><div class="direct">Vôo direto</div><div class="line"></div><div class="dur">${v.dur}</div></div>
    <div class="port r"><div class="code">${v.para}</div><div class="airport">${NOME[v.para]}</div><div class="when">${v.chega}</div></div></div>`;
  const o=c.hotel;
  h+=o?`<div class="acc"><div class="acc-top">🏨 ${e(o.nome)}<span class="io">Check-in ${o.in} &nbsp;↔&nbsp; Check-out ${o.out}</span></div>
    <div class="acc-body"><div><div class="k">Endereço</div><b>Av. N. Sra. da Penha, 1993</b></div>
    <div><div class="k">Quarto</div><b>${e(o.quarto)}</b></div><div><div class="k">Café da manhã</div><b>Incluso</b></div>
    <div><div class="k">Localizador</div><b>${e(o.loc)}</b></div></div></div>`
   :`<div class="acc warn"><div class="acc-top">🏨 Sem voucher de hotel</div></div>`;
  h+=`<div class="tagline">${c.bagagem?`<span class="tag">Bagagem: ${e(c.bagagem)}</span>`:''}<span class="tag">Vouchers ${e(c.vouchers)}</span></div></div></div>`;
  $('detalhe').innerHTML=h;
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-id]'),v=ev.target.closest('[data-back]');
  if(b){detalhe(G.find(c=>c.id===b.dataset.id));$('lista').classList.add('hidden');$('detalhe').classList.remove('hidden');scrollTo(0,0)}
  if(v){$('detalhe').classList.add('hidden');$('lista').classList.remove('hidden');scrollTo(0,0)}
});
lista();
</script>
</html>
